name: Jadvalni yangilash

on:
  schedule:
    - cron: "0 20 * * *"   # har kuni 01:00 (Toshkent)
  workflow_dispatch:        # qo'lda ishga tushirish tugmasi

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_schedule.py
      - name: O'zgargan bo'lsa saqlash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add jadval.json
          git diff --cached --quiet || git commit -m "Jadval yangilandi"
          git push
